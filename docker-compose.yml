services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command:
      - sh
      - -c
      - alembic upgrade head && python -m app.cli seed --if-empty && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: demo
      APP_VERSION: 0.13.0
      DATABASE_URL: sqlite:////data/wealthtwin.db
      SYNTHETIC_DATA_PATH: /seed-data/synthetic/families.json
      FINANCIAL_RULES_PATH: /seed-data/rules/financial_health_v1.json
      PLANNING_RULES_PATH: /seed-data/rules/planning_waterfall_v1.json
      PORTFOLIO_RULES_PATH: /seed-data/rules/portfolio_policy_v1.json
      PRODUCT_CATALOG_PATH: /seed-data/products/mock_products_v1.json
      FUND_ADVISORY_CATALOG_PATH: /seed-data/products/verified_real_funds_v1.json
      TWIN_RULES_PATH: /seed-data/rules/twin_simulation_v1.json
      BEHAVIOR_RULES_PATH: /seed-data/rules/behavior_finance_v1.json
      KNOWLEDGE_BASE_PATH: /seed-data/knowledge/controlled_knowledge_v1.json
      DEMO_BENCHMARK_PATH: /seed-data/benchmarks/demo_release_v1.json
      DEMO_STORY_VERSION: wealthtwin-main-demo-v1.0.0
      DEMO_CACHE_TTL_SECONDS: "300"
      DEMO_MAIN_PATH_COUNT: "100"
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      LLM_ALLOWED_HOSTS: ${LLM_ALLOWED_HOSTS:-api.deepseek.com}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-8080},http://127.0.0.1:${FRONTEND_PORT:-8080}
      ALLOWED_HOSTS: localhost,127.0.0.1,test,testserver,backend
      DEMO_AUTH_ENABLED: "true"
      MAX_REQUEST_BODY_BYTES: "1048576"
      MAX_UPLOAD_BYTES: "524288"
      RATE_LIMIT_PER_MINUTE: "120"
      EXPENSIVE_RATE_LIMIT_PER_MINUTE: "30"
    volumes:
      - wealthtwin-data:/data
      - ./data:/seed-data:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: wealthtwin
      POSTGRES_USER: wealthtwin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - wealthtwin-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthtwin -d wealthtwin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wealthtwin-data:
  wealthtwin-postgres:
