name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Chinese PDF font
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests alembic
      - name: Type check
        run: mypy app
      - name: Test
        run: pytest -q
      - name: Verify migration from an empty database
        env:
          DATABASE_URL: sqlite:///./ci.db
          LLM_PROVIDER: mock
        run: |
          alembic upgrade head
          alembic check
          python -m app.cli seed --reset

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install frontend
        run: npm ci
      - name: Lint
        run: npm run frontend:lint
      - name: Type check
        run: npm run frontend:typecheck
      - name: Unit and accessibility tests
        run: npm run frontend:test
      - name: Sites proxy tests
        run: npm run test:sites
      - name: Build frontend and Sites package
        run: npm run build:sites
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end smoke
        run: npm run frontend:e2e
